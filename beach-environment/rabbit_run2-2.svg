<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -35 200 255" width="200" height="255">
  <!-- Soft Airborne Shadow -->
  <ellipse cx="100" cy="210" rx="35" ry="8" fill="rgba(0,0,0,0.12)"/>

  <!-- Feet (Tucked up airborne) -->
  <ellipse cx="65" cy="180" rx="15" ry="12" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="3"/>
  <ellipse cx="135" cy="180" rx="15" ry="12" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="3"/>
  <ellipse cx="65" cy="183" rx="7" ry="4" fill="#F472B6"/>
  <ellipse cx="135" cy="183" rx="7" ry="4" fill="#F472B6"/>

  <!-- Main Body (Raised / Airborne) -->
  <g transform="translate(0, -10)">
    <path d="M 50 135 C 40 180, 160 180, 150 135 C 145 100, 125 90, 100 90 C 75 90, 55 100, 50 135 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="4"/>
    <path d="M 55 140 C 50 170, 150 170, 145 140 C 140 115, 120 98, 100 98 C 80 98, 60 115, 55 140 Z" fill="#FFFFFF"/>

    <!-- Cotton Tail High in Center -->
    <circle cx="100" cy="150" r="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>
    <circle cx="96" cy="144" r="17" fill="#FFF" opacity="0.9"/>

    <!-- Head -->
    <circle cx="100" cy="58" r="37" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="4"/>

    <!-- Long Ears Floating Up/Back -->
    <g transform="rotate(-6 80 50)">
      <path d="M 70 55 C 55 15, 58 -20, 78 -25 C 93 -20, 90 15, 80 55 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="4"/>
      <path d="M 72 45 C 63 15, 65 -10, 78 -15 C 86 -10, 83 15, 76 45 Z" fill="#FBCFE8" opacity="0.85"/>
    </g>
    <g transform="rotate(6 120 50)">
      <path d="M 120 55 C 110 15, 107 -20, 122 -25 C 142 -20, 145 15, 130 55 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="4"/>
      <path d="M 122 45 C 115 15, 113 -10, 122 -15 C 135 -10, 137 15, 128 45 Z" fill="#FBCFE8" opacity="0.85"/>
    </g>
  </g>
</svg>
