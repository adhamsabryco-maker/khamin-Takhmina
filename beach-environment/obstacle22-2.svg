<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Round Hay Bale Obstacle -->
  <!-- Shadow -->
  <ellipse cx="60" cy="110" rx="48" ry="10" fill="rgba(0,0,0,0.2)"/>

  <!-- Main Hay Cylinder Body -->
  <rect x="25" y="35" width="70" height="70" rx="35" fill="#EAB308" stroke="#A16207" stroke-width="4"/>
  <ellipse cx="60" cy="70" rx="35" ry="35" fill="#FACC15" stroke="#CA8A04" stroke-width="4"/>

  <!-- Spiral Hay Lines -->
  <circle cx="60" cy="70" r="26" fill="none" stroke="#EAB308" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="60" cy="70" r="16" fill="none" stroke="#CA8A04" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="60" cy="70" r="6" fill="#A16207"/>

  <!-- Tie String -->
  <path d="M 25 50 Q 60 55, 95 50" stroke="#78350F" stroke-width="3" fill="none"/>
  <path d="M 25 90 Q 60 95, 95 90" stroke="#78350F" stroke-width="3" fill="none"/>
</svg>
