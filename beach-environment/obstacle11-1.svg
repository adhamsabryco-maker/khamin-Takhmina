<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Wooden Farm Fence Obstacle -->
  <!-- Shadow -->
  <ellipse cx="60" cy="110" rx="50" ry="10" fill="rgba(0,0,0,0.2)"/>

  <!-- Left Post -->
  <rect x="15" y="30" width="18" height="75" rx="3" fill="#B45309" stroke="#78350F" stroke-width="3"/>
  <path d="M 15 30 L 24 15 L 33 30 Z" fill="#D97706" stroke="#78350F" stroke-width="3"/>

  <!-- Right Post -->
  <rect x="87" y="30" width="18" height="75" rx="3" fill="#B45309" stroke="#78350F" stroke-width="3"/>
  <path d="M 87 30 L 96 15 L 105 30 Z" fill="#D97706" stroke="#78350F" stroke-width="3"/>

  <!-- Horizontal Planks with Hazard Warning Stripes -->
