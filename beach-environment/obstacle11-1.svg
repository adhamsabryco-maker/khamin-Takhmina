  <path d="M 25 40 L 15 60 M 45 40 L 35 60 M 65 40 L 55 60 M 85 40 L 75 60 M 105 40 L 95 60" stroke="#1E293B" stroke-width="8" stroke-linecap="butt"/>

  <rect x="10" y="70" width="100" height="20" rx="4" fill="#EAB308" stroke="#78350F" stroke-width="3"/>
  <path d="M 25 70 L 15 90 M 45 70 L 35 90 M 65 70 L 55 90 M 85 70 L 75 90 M 105 70 L 95 90" stroke="#1E293B" stroke-width="8" stroke-linecap="butt"/>
