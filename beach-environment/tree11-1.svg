<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- Tree Trunk -->
  <path d="M 85 280 C 85 190, 75 160, 95 120 C 105 160, 115 190, 115 280 Z" fill="#78350F" stroke="#451A03" stroke-width="3"/>
  <!-- Root Flares -->
  <path d="M 70 280 C 80 270, 85 250, 88 230" stroke="#451A03" stroke-width="3" fill="none"/>
  <path d="M 130 280 C 120 270, 115 250, 112 230" stroke="#451A03" stroke-width="3" fill="none"/>

  <!-- Leafy Canopy - Layered Fluffy Green Clouds -->
  <!-- Dark Back Layer -->
  <circle cx="100" cy="110" r="75" fill="#15803D"/>
  <circle cx="55" cy="130" r="50" fill="#166534"/>
  <circle cx="145" cy="130" r="50" fill="#166534"/>

  <!-- Main Mid Layer -->
  <circle cx="100" cy="100" r="70" fill="#16A34A"/>
  <circle cx="55" cy="115" r="45" fill="#15803D"/>
  <circle cx="145" cy="115" r="45" fill="#15803D"/>
  <circle cx="100" cy="65" r="55" fill="#22C55E"/>

  <!-- Top Bright Highlights -->
  <circle cx="85" cy="60" r="42" fill="#4ADE80"/>
  <circle cx="120" cy="75" r="38" fill="#4ADE80"/>
  <circle cx="50" cy="100" r="32" fill="#4ADE80"/>

  <!-- Red Apples on Farm Tree -->
  <circle cx="60" cy="90" r="9" fill="#EF4444"/>
  <circle cx="60" cy="90" r="3" fill="#FECACA" opacity="0.6"/>

  <circle cx="130" cy="80" r="9" fill="#EF4444"/>
  <circle cx="130" cy="80" r="3" fill="#FECACA" opacity="0.6"/>

  <circle cx="100" cy="120" r="9" fill="#EF4444"/>
  <circle cx="100" cy="120" r="3" fill="#FECACA" opacity="0.6"/>

  <circle cx="150" cy="125" r="9" fill="#EF4444"/>
  <circle cx="150" cy="125" r="3" fill="#FECACA" opacity="0.6"/>

  <circle cx="80" cy="140" r="8" fill="#EF4444"/>
</svg>
