name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 👈 التحديث إلى الإصدار 20 (مهم جداً)

      - name: Install Dependencies
        # 👈 إجبار npm على تجاهل ملف القفل وتنزيل الحزم من الصفر بقوة
        run: npm install --no-package-lock --force

      - name: Build Frontend
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: khamin-takhmina-guess-game.online
