name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 🛠️ حل مشكلة الإيرور: مسح الكاش وملف القفل قبل التحميل
      - name: Install Dependencies
        run: |
          rm -rf package-lock.json node_modules
          npm install

      - name: Build Frontend
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # 🌐 ضع الدومين الخاص بك هنا (بدون https://)
          cname: www.khamin-takhmina-guess-game.online
