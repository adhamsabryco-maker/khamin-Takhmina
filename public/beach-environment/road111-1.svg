<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Rich Earthen Dirt Base -->
  <rect width="600" height="400" fill="#B48356"/>
  <rect width="600" height="400" fill="url(#dirtGrad1)"/>
  <defs>
    <linearGradient id="dirtGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C69567"/>
      <stop offset="100%" stop-color="#9C6B3F"/>
    </linearGradient>
  </defs>

  <!-- Side Grass Trims (Bordering the dirt path) -->
  <path d="M 0 0 C 30 100, 15 300, 0 400 Z" fill="#22C55E"/>
  <path d="M 600 0 C 570 100, 585 300, 600 400 Z" fill="#22C55E"/>
  <path d="M 0 0 C 20 100, 10 300, 0 400 Z" fill="#4ADE80"/>
  <path d="M 600 0 C 580 100, 590 300, 600 400 Z" fill="#4ADE80"/>

  <!-- Farm Track Wheel Grooves / Soil Lines (Lane Markings in Dirt Style) -->
  <path d="M 200 0 L 200 400" stroke="#84542B" stroke-width="8" stroke-dasharray="30 20" opacity="0.6"/>
  <path d="M 400 0 L 400 400" stroke="#84542B" stroke-width="8" stroke-dasharray="30 20" opacity="0.6"/>

  <!-- Small Soil Pebbles / Texture Details -->
  <circle cx="120" cy="80" r="4" fill="#72441E" opacity="0.5"/>
  <circle cx="280" cy="140" r="6" fill="#84542B" opacity="0.5"/>
  <circle cx="480" cy="60" r="5" fill="#72441E" opacity="0.5"/>
  <circle cx="150" cy="260" r="6" fill="#D4A373" opacity="0.6"/>
  <circle cx="340" cy="320" r="5" fill="#72441E" opacity="0.5"/>
  <circle cx="450" cy="280" r="4" fill="#84542B" opacity="0.5"/>
</svg>
