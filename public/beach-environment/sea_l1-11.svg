<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Lush Green Grass Base -->
  <rect width="400" height="400" fill="#22C55E"/>
  
  <!-- Soft Gradient Meadow Shading -->
  <path d="M0 0 L400 0 L400 400 L0 400 Z" fill="url(#grassGrad)"/>
  <defs>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>

  <!-- Grass Blades & Tufts -->
  <path d="M 30 80 Q 25 50, 20 40 Q 35 55, 40 80 Z" fill="#86EFAC"/>
  <path d="M 40 80 Q 45 45, 50 35 Q 48 55, 45 80 Z" fill="#15803D"/>

  <path d="M 180 150 Q 170 120, 160 110 Q 180 125, 190 150 Z" fill="#86EFAC"/>
  <path d="M 190 150 Q 200 115, 205 105 Q 200 125, 195 150 Z" fill="#15803D"/>

  <path d="M 320 90 Q 310 60, 300 50 Q 320 65, 330 90 Z" fill="#4ADE80"/>
  <path d="M 330 90 Q 340 55, 345 45 Q 340 65, 335 90 Z" fill="#166534"/>

  <!-- Wildflowers (Yellow Daisies & Red Tulips) -->
  <!-- Daisy 1 -->
  <g transform="translate(80, 120)">
    <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
    <circle cx="-12" cy="0" r="8" fill="#FFFFFF"/>
    <circle cx="12" cy="0" r="8" fill="#FFFFFF"/>
    <circle cx="0" cy="-12" r="8" fill="#FFFFFF"/>
    <circle cx="0" cy="12" r="8" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="8" fill="#FACC15"/>
  </g>

  <!-- Red Flower 1 -->
  <g transform="translate(260, 220)">
    <circle cx="0" cy="-6" r="10" fill="#EF4444"/>
    <circle cx="-8" cy="4" r="10" fill="#F87171"/>
    <circle cx="8" cy="4" r="10" fill="#F87171"/>
    <circle cx="0" cy="2" r="6" fill="#FDE047"/>
  </g>

  <!-- Daisy 2 -->
  <g transform="translate(120, 320)">
    <circle cx="0" cy="0" r="9" fill="#FFFFFF"/>
    <circle cx="-10" cy="0" r="7" fill="#FFFFFF"/>
    <circle cx="10" cy="0" r="7" fill="#FFFFFF"/>
    <circle cx="0" cy="-10" r="7" fill="#FFFFFF"/>
    <circle cx="0" cy="10" r="7" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="7" fill="#F59E0B"/>
  </g>

  <!-- Small Bush Patch -->
  <path d="M 280 340 C 260 310, 340 310, 330 340 C 350 350, 340 390, 300 390 C 260 390, 260 360, 280 340 Z" fill="#15803D" opacity="0.85"/>
  <path d="M 285 345 C 270 320, 330 320, 320 345 Z" fill="#4ADE80" opacity="0.6"/>
</svg>
