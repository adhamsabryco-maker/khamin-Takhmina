<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <!-- Grass Base -->
  <path d="M 10 90 Q 20 60, 25 50 Q 30 70, 40 90 Z" fill="#22C55E"/>
  <path d="M 40 90 Q 50 50, 55 40 Q 60 65, 70 90 Z" fill="#4ADE80"/>
  <path d="M 70 90 Q 80 55, 85 45 Q 90 70, 100 90 Z" fill="#16A34A"/>

  <!-- Large Sunflower -->
  <g transform="translate(60, 45)">
    <!-- Stems -->
    <path d="M 0 0 L 0 45" stroke="#15803D" stroke-width="5" stroke-linecap="round"/>
    <path d="M 0 20 Q -15 15, -20 25" stroke="#15803D" stroke-width="4" fill="none"/>
    
    <!-- Flower Head -->
    <circle cx="0" cy="0" r="14" fill="#F59E0B"/>
    <circle cx="-14" cy="0" r="8" fill="#FBBF24"/>
    <circle cx="14" cy="0" r="8" fill="#FBBF24"/>
    <circle cx="0" cy="-14" r="8" fill="#FBBF24"/>
    <circle cx="0" cy="14" r="8" fill="#FBBF24"/>
    <circle cx="-10" cy="-10" r="8" fill="#FBBF24"/>
    <circle cx="10" cy="10" r="8" fill="#FBBF24"/>
    <circle cx="-10" cy="10" r="8" fill="#FBBF24"/>
    <circle cx="10" cy="-10" r="8" fill="#FBBF24"/>
    <!-- Center seeds -->
    <circle cx="0" cy="0" r="10" fill="#78350F"/>
  </g>

  <!-- Smaller Daisy on left -->
  <g transform="translate(30, 65)">
    <path d="M 0 0 L 0 25" stroke="#15803D" stroke-width="3"/>
    <circle cx="0" cy="0" r="7" fill="#FFFFFF"/>
    <circle cx="-7" cy="0" r="5" fill="#FFFFFF"/>
    <circle cx="7" cy="0" r="5" fill="#FFFFFF"/>
    <circle cx="0" cy="-7" r="5" fill="#FFFFFF"/>
    <circle cx="0" cy="7" r="5" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="5" fill="#FACC15"/>
  </g>
</svg>
